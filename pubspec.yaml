name: billing_system
description: "BillBlitz - a fast billing and invoicing app built with Flutter and Firebase."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  cloud_firestore: ^6.0.0
  firebase_core: ^4.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Launcher icons are generated from assets/images (see tool/generate_logo.py):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/launcher_background.png"
  adaptive_icon_foreground: "assets/images/launcher_foreground.png"
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#F5F4FA"
    theme_color: "#4A32BD"
  windows:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    icon_size: 256
